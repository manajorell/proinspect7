name: CI
"on":
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate Fixed Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/proinspect.keystore -alias proinspect -storepass proinspect123 -keypass proinspect123 -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=ProInspect,O=ProInspect,C=US"
          echo "=== SHA1 ==="
          keytool -list -v -keystore ~/proinspect.keystore -alias proinspect -storepass proinspect123 | grep SHA1
          echo "=== BASE64 ==="
          base64 ~/proinspect.keystore
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ProInspect-APK
          path: app/build/outputs/apk/debug/app-debug.apk
